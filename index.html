<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="format-detection" content="telephone=no">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="description" content="Sistema de controle de entregas - JustDelivery">
    <meta name="theme-color" content="#667eea">
    <title>Sistema de Controle de Entregas - JustDelivery</title>
    
    <!-- Preload critical CSS -->
    <style>
        /* Critical CSS inline para carregamento rápido */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: Arial, sans-serif;
            background: #667eea;
            min-height: 100vh;
            color: #333;
            overflow-x: hidden;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        
        /* Fallback loading state */
        .loading-fallback {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 50vh;
            font-size: 18px;
            color: white;
        }
        
        @media (max-width: 768px) {
            .container {
                padding: 10px;
            }
        }
    </style>
    
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🚚 JustDelivery - Controle de Entregas</h1>
            <p>Sistema de gestão de tickets de entrega</p>
        </header>

        <main>
            <!-- Cadastro de Pratos do Dia -->
            <section class="pratos-section">
                <h2>Gerenciamento de Pratos do Dia</h2>
                <div class="pratos-cadastro">
                    <form id="pratoForm">
                        <div class="form-row">
                            <div class="form-group">
                                <label for="nomePrato">Nome do Prato:</label>
                                <input type="text" id="nomePrato" placeholder="Ex: Arroz, feijão e frango à milanesa" required>
                            </div>
                            <div class="form-group">
                                <label for="precoPrato">Preço (R$):</label>
                                <input type="number" id="precoPrato" step="0.01" min="0" placeholder="0.00" required>
                            </div>
                            <button type="submit" class="btn-add-prato">+ Adicionar</button>
                        </div>
                    </form>
                </div>
                <div id="pratosList" class="pratos-list"></div>
            </section>

            <!-- Cadastro de Itens Adicionais -->
            <section class="adicionais-section">
                <h2>Gerenciamento de Itens Adicionais</h2>
                <div class="adicionais-cadastro">
                    <form id="adicionalForm">
                        <div class="form-row">
                            <div class="form-group">
                                <label for="nomeAdicional">Nome do Item:</label>
                                <input type="text" id="nomeAdicional" placeholder="Ex: Refrigerante, Sobremesa, etc." required>
                            </div>
                            <div class="form-group">
                                <label for="precoAdicional">Preço (R$):</label>
                                <input type="number" id="precoAdicional" step="0.01" min="0" placeholder="0.00" required>
                            </div>
                            <button type="submit" class="btn-add-adicional">+ Adicionar</button>
                        </div>
                    </form>
                </div>
                <div id="adicionaisList" class="adicionais-list"></div>
            </section>

            <!-- Cadastro de Entregadores -->
            <section class="entregadores-section">
                <h2>Entregadores</h2>
                <div class="entregadores-cadastro">
                    <form id="entregadorForm">
                        <div class="form-row">
                            <div class="form-group">
                                <label for="nomeEntregador">Nome do Entregador:</label>
                                <input type="text" id="nomeEntregador" placeholder="Ex: João Silva" required>
                            </div>
                            <div class="form-group">
                                <label for="telefoneEntregador">Telefone:</label>
                                <input type="tel" id="telefoneEntregador" placeholder="(11) 99999-9999" required>
                            </div>
                            <div class="form-group">
                                <label for="veiculoEntregador">Veículo:</label>
                                <select id="veiculoEntregador" required>
                                    <option value="">Selecione o veículo</option>
                                    <option value="Moto">Moto</option>
                                    <option value="Bicicleta">Bicicleta</option>
                                    <option value="Carro">Carro</option>
                                    <option value="A pé">A pé</option>
                                </select>
                            </div>
                            <button type="submit" class="btn-add-entregador">+ Adicionar</button>
                        </div>
                    </form>
                </div>
                <div id="entregadoresList" class="entregadores-list"></div>
            </section>

            <div class="desktop-grid">
                <!-- Formulário de Novo Ticket -->
                <section class="form-section">
                    <h2>Novo Ticket de Entrega</h2>
                    <form id="deliveryForm">
                        <div class="form-group">
                            <label for="pratoPrincipal">Prato Principal:</label>
                            <select id="pratoPrincipal" required>
                                <option value="">Selecione um prato do cardápio</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="valorPrato">Valor do Prato:</label>
                            <input type="text" id="valorPrato" readonly style="background: #f7fafc; cursor: not-allowed;">
                        </div>

                    <div class="form-group">
                        <label>Itens Adicionais:</label>
                        <div id="itensAdicionaisContainer" class="adicional-group">
                            <!-- Itens adicionais serão carregados dinamicamente aqui -->
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="entregador">Nome do Entregador:</label>
                        <select id="entregador" required>
                            <option value="">Selecione um entregador</option>
                            <option value="João Silva">João Silva</option>
                            <option value="Maria Santos">Maria Santos</option>
                            <option value="Pedro Costa">Pedro Costa</option>
                            <option value="Ana Oliveira">Ana Oliveira</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="dataEntrega">Data da Entrega:</label>
                        <input type="date" id="dataEntrega" required>
                    </div>

                    <div class="form-group">
                        <label for="horaEntrega">Hora Prevista da Entrega:</label>
                        <input type="time" id="horaEntrega" required>
                    </div>

                    <div class="form-group">
                        <label for="enderecoEntrega">Endereço de Entrega:</label>
                        <textarea id="enderecoEntrega" rows="3" required></textarea>
                    </div>

                    <button type="submit" class="btn-submit">Criar Ticket de Entrega</button>
                </form>
            </section>

            <!-- Lista de Tickets -->
            <section class="tickets-section">
                <h2>Tickets de Entrega</h2>
                <div class="filter-section">
                    <select id="filtroStatus">
                        <option value="">Todos os status</option>
                        <option value="pendente">Pendente</option>
                        <option value="em-transito">Em Trânsito</option>
                        <option value="entregue">Entregue</option>
                    </select>
                    <input type="text" id="filtroEntregador" placeholder="Filtrar por entregador...">
                </div>
                <div id="ticketsList" class="tickets-list"></div>
            </section>
            </div>
        </main>
    </div>

    <!-- Loading fallback -->
    <div id="loadingFallback" class="loading-fallback">
        Carregando sistema...
    </div>

    <!-- Scripts with error handling -->
    <script>
        // Error handling global
        window.onerror = function(msg, url, line, col, error) {
            console.log('Erro:', msg, 'em', url, 'linha', line);
            return false;
        };
        
        // Polyfills básicos para Android antigo
        if (!Array.prototype.filter) {
            Array.prototype.filter = function(callback) {
                var filtered = [];
                for (var i = 0; i < this.length; i++) {
                    if (callback(this[i], i, this)) {
                        filtered.push(this[i]);
                    }
                }
                return filtered;
            };
        }
        
        if (!Array.prototype.forEach) {
            Array.prototype.forEach = function(callback) {
                for (var i = 0; i < this.length; i++) {
                    callback(this[i], i, this);
                }
            };
        }
    </script>
    <script src="script.js"></script>
    <script src="dados-exemplo.js"></script>
    
    <script>
        // Hide loading fallback when everything is loaded
        window.addEventListener('load', function() {
            var loading = document.getElementById('loadingFallback');
            if (loading) {
                loading.style.display = 'none';
            }
        });
    </script>
</body>
</html>
